<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>DrawLead ERP Sales CRM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--c:#fff;--t:#1b2430;--m:#6b7788;--b:#dde3ea;--a:#2563eb;--r:#dc2626;--rb:#fee2e2;--y:#b45309;--yb:#fef3c7;--g:#16a34a;--gb:#dcfce7}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f141b;--c:#18202a;--t:#e6ebf2;--m:#93a0b2;--b:#2a3542;--a:#60a5fa;--r:#f87171;--rb:#3b1c1f;--y:#fbbf24;--yb:#3a2f12;--g:#4ade80;--gb:#13321f}}
:root[data-theme=dark]{--bg:#0f141b;--c:#18202a;--t:#e6ebf2;--m:#93a0b2;--b:#2a3542;--a:#60a5fa;--r:#f87171;--rb:#3b1c1f;--y:#fbbf24;--yb:#3a2f12;--g:#4ade80;--gb:#13321f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--c);border-bottom:1px solid var(--b);padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
h1{font-size:16px;margin:0 6px 0 0}nav{display:flex;gap:4px;flex-wrap:wrap}
button,select,input,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.on,button.p{background:var(--a);color:#fff;border-color:var(--a)}button.d{color:var(--r)}button.big{padding:11px 14px;font-weight:600}
.fl{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;align-items:center}
main{padding:0 12px 80px}.view{display:none}.view.on{display:block}
#board{display:flex;gap:10px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 245px;background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:8px;min-height:160px}
.col h3{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between;text-transform:uppercase}.col h3 span{color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-left:4px solid var(--g);border-radius:8px;padding:8px;margin-bottom:8px;cursor:grab}
.card.yel{border-left-color:var(--y)}.card.red{border-left-color:var(--r);background:var(--rb)}.card small{display:block;color:var(--m)}
.bd{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:var(--bg);border:1px solid var(--b);margin:3px 3px 0 0}.bd.r{background:var(--rb);color:var(--r)}.bd.o{background:var(--yb);color:var(--y)}
.tw{overflow-x:auto;background:var(--c);border:1px solid var(--b);border-radius:10px;margin-bottom:14px}
table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--b)}th{font-size:12px;color:var(--m);cursor:pointer}tr.cl{cursor:pointer}
td.red,.kpi.red{background:var(--rb);color:var(--r);font-weight:700}.kpi.org{background:var(--yb)}
h2{font-size:14px;margin:16px 0 8px}.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.kpi{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px;cursor:default}.kpi.k{cursor:pointer}.kpi small{color:var(--m);display:block;font-size:12px}.kpi b{font-size:18px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}.bar i{display:block;height:16px;background:var(--a);border-radius:4px}.bar span{width:120px;font-size:12px}
dialog{border:1px solid var(--b);border-radius:12px;background:var(--c);color:var(--t);width:min(720px,97vw);max-height:93vh;padding:14px}dialog::backdrop{background:#0008}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:6px}.grid label{display:flex;flex-direction:column;font-size:12px;color:var(--m);gap:2px}.grid input,.grid select,.grid textarea{width:100%}
.note{color:var(--m);font-size:12px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin-bottom:8px}.err{color:var(--r);font-weight:600}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.qa a,.qa button{text-decoration:none;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:9px 12px;background:var(--c)}
.tl div{padding:3px 0;border-bottom:1px dashed var(--b);font-size:13px}.tl b{color:var(--m);font-weight:500}
#fab{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;border-radius:28px;padding:13px 18px;box-shadow:0 4px 14px #0005}
</style></head><body>
<header><h1>DrawLead CRM</h1><nav id="nav"></nav><input id="gs" placeholder="Search…" oninput="gsr()" style="flex:1;min-width:110px"><select id="role" onchange="D.role=this.value;sv();all()"><option>Admin</option><option>Manager</option><option>Setter</option><option>Closer</option></select><input id="me" placeholder="My name" style="width:100px" onchange="D.me=this.value;sv();all()"></header>
<div class="fl"><select id="fr"></select><select id="fs"></select><input type="date" id="f1"><input type="date" id="f2"><button onclick="clr()">Clear</button></div>
<main>
<section id="v-today" class="view on"></section>
<section id="v-board" class="view"><div id="board"></div></section>
<section id="v-log" class="view"><div class="row"><select id="fst" onchange="log()"></select><input id="q" placeholder="Filter…" oninput="log()"><button onclick="expLog()">Export Excel</button></div><div class="tw"><table id="logt"></table></div></section>
<section id="v-dash" class="view"></section>
<section id="v-fc" class="view"></section>
<section id="v-daily" class="view"></section>
<section id="v-imp" class="view"></section>
</main>
<button id="fab" class="p" onclick="actDlg()">+ Activity</button>
<dialog id="dlg"></dialog><dialog id="dl2"></dialog>
<script>
const ST=['New Lead','Contacted','Qualified','Demo Booked','Demo Completed','Proposal Sent','Negotiation','Payment Pending','Won','Lost'];
const OPT={src:['Cold Call','BNI','WhatsApp','LinkedIn','Instagram','Facebook','Website','Referral','Google','Email','Walk-in','Existing Client','Other'],ct:['','Builder','Contractor','Civil Contractor','Interior Contractor','Developer','Architecture Firm','Other'],sys:['','Excel','Tally','Other ERP','Multiple Software','Manual','No System','Unknown'],usr:['','1–5','6–10','11–25','26–50','50+'],dm:['','Owner','Director','Partner','GM','Manager','IT/Admin','Other'],yn:['','Yes','No'],tm:['','Immediate','Within 30 Days','1–3 Months','3–6 Months','Later','Unknown'],bg:['','Budget Confirmed','Budget Discussion','Not Discussed','No Budget','Unknown'],ds:['','Scheduled','Completed','No Show','Rescheduled','Cancelled','Not Qualified'],ps:['','Draft','Sent','Viewed','Negotiation','Accepted','Rejected','Expired'],lr:['','Price','Timing','Competitor','No Budget','Decision Maker','Partner/Management','Ghosted','Not Qualified','Existing ERP','Feature Gap','Other'],mod:['Project Management','Estimation','CRM','Purchase','Inventory','Accounts','HR','Payroll','Multiple Departments','Workflow Automation','Management Dashboard','Custom ERP','Other'],at:['Call','WhatsApp','Email','LinkedIn','Other'],ao:['Connected','No Answer','Busy','Interested','Not Interested','Call Back','Demo Booked','Wrong Number','Not Qualified']};
const G=[['Contact',[['name','Lead Name'],['company','Company Name'],['phone','Phone','tel'],['email','Email','email'],['location','Location'],['industry','Industry / Business Type'],['source','Lead Source','sel',OPT.src],['setter','Setter','text','sl'],['closer','Closer','text','sl'],['stage','Lead Stage','sel',ST],['created','Date Created','datetime-local']]],
['Qualification',[['ctype','Company Type','sel',OPT.ct],['system','Current System','sel',OPT.sys],['users','No. of Users','sel',OPT.usr],['depts','No. of Departments','number'],['dm','Key Decision Maker','sel',OPT.dm],['dmInv','Decision Maker Involved','sel',OPT.yn],['timeline','Implementation Timeline','sel',OPT.tm],['budget','Budget Status','sel',OPT.bg],['est','Estimated Deal Value','number'],['pain','Current Pain Point','textarea']]],
['Demo',[['demoDate','Demo Date/Time','datetime-local'],['demoStatus','Demo Status','sel',OPT.ds],['objections','Objections','textarea'],['nextStep','Next Step','text']]],
['Proposal',[['propNo','Proposal No.'],['propDate','Proposal Date','date'],['propVal','Proposal Value','number'],['disc','Discount','number'],['propStatus','Proposal Status','sel',OPT.ps],['expClose','Expected Closing','date']]],
['Payment & Commission',[['deposit','Advance / Deposit','number'],['depDate','Deposit Date','date'],['collected','Amount Collected','number'],['nextPay','Next Payment Date','date'],['paidDate','Date Paid in Full','date'],['refund','Refund / Clawback','number'],['sComm','Setter Commission %','number'],['cComm','Closer Commission %','number']]],
['Follow-up & Loss',[['nextFu','Next Follow-Up','date'],['fuOwner','Follow-Up Owner'],['fuNote','Follow-Up Notes'],['loss','Loss Reason','sel',OPT.lr],['lossNote','Lost Note'],['notes','Notes','textarea']]]];
let D={leads:[],daily:[],imports:[],audit:[],seq:0,role:'Admin',me:'',set:{fu:7,dep:14,lag:4,prop:5,sc:2,cc:5,target:500000},fa:{}};
try{Object.assign(D,JSON.parse(localStorage.getItem('dl')||'{}'))}catch(e){}
const $=id=>document.getElementById(id),n=x=>+x||0,iso=(d=new Date())=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16),td=()=>iso().slice(0,10);
const dd=(a,b=new Date())=>(new Date(b)-new Date(a))/864e5,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,pct=(a,b)=>b?(a/b*100).toFixed(1)+'%':'–',inr=x=>'₹'+Math.round(x).toLocaleString('en-IN'),r1=x=>x==null?'–':x.toFixed(1);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sv=()=>{try{localStorage.setItem('dl',JSON.stringify(D))}catch(e){}};
// ---- derived values
const fin=l=>Math.max(0,n(l.propVal)-n(l.disc))||n(l.est),rev=l=>l.stage=='Won'?fin(l):0,net=l=>rev(l)-n(l.refund);
const pay=l=>fin(l)>0&&n(l.collected)>=fin(l)?'Paid in Full':n(l.collected)>0?'Partially Paid':'Not Paid',bal=l=>Math.max(0,fin(l)-n(l.collected));
const cS=l=>net(l)*(l.sComm!==''&&l.sComm!=null?n(l.sComm):D.set.sc)/100,cC=l=>net(l)*(l.cComm!==''&&l.cComm!=null?n(l.cComm):D.set.cc)/100;
const isOpen=l=>l.stage!='Won'&&l.stage!='Lost',idx=s=>ST.indexOf(s);
const reached=(l,s)=>l.tl.some(x=>x.s&&x.s!='Lost'&&idx(x.s)>=idx(s));
const stT=(l,s)=>(l.tl.find(x=>x.s==s)||{}).t;
const last=l=>l.tl.reduce((m,x)=>x.t>m?x.t:m,l.created||'');
const ds=l=>Math.floor(dd(last(l)));
const fuS=l=>{if(!isOpen(l))return'';const t=td();if(l.nextFu&&l.nextFu<t||ds(l)>=D.set.fu)return'red';if(l.nextFu&&l.nextFu<=iso(new Date(Date.now()+2*864e5)).slice(0,10))return'yel';return'grn'};
const lagD=l=>{const b=stT(l,'Demo Booked');return b&&l.demoDate?dd(b,l.demoDate):null};
const acts=l=>l.acts||[];
// ---- leak rules
const LK=[['Demo booked but not completed','r',l=>l.stage=='Demo Booked'&&l.demoDate&&l.demoDate.slice(0,10)<td()],['Demo no-show without reschedule','r',l=>l.demoStatus=='No Show'&&isOpen(l)],['Proposal sent, no follow-up set','r',l=>l.stage=='Proposal Sent'&&!l.nextFu],['Proposal older than '+D.set.prop+'d without activity','r',l=>l.stage=='Proposal Sent'&&ds(l)>=D.set.prop],['Negotiation with no activity','r',l=>l.stage=='Negotiation'&&ds(l)>=3],['Payment pending','o',l=>l.stage=='Payment Pending'],['Deposit/balance unpaid '+D.set.dep+'d+','r',l=>(l.stage=='Payment Pending'||l.stage=='Won')&&bal(l)>0&&dd(l.depDate||stT(l,'Payment Pending')||stT(l,'Won')||l.created)>=D.set.dep],['Follow-up untouched '+D.set.fu+'d+','r',l=>isOpen(l)&&l.stage!='New Lead'&&ds(l)>=D.set.fu],['Demo booking lag > '+D.set.lag+'d','r',l=>(lagD(l)||0)>D.set.lag],['Qualified lead, no demo booked','o',l=>l.stage=='Qualified']];
// ---- scope & filters
function VL(){const r=$('fr').value,s=$('fs').value,a=$('f1').value,b=$('f2').value,me=(D.me||'').toLowerCase();
return D.leads.filter(l=>(D.role=='Setter'&&me?(l.setter||'').toLowerCase()==me:D.role=='Closer'&&me?(l.closer||'').toLowerCase()==me:true)&&(!r||l.setter==r||l.closer==r)&&(!s||l.source==s)&&(!a||l.created.slice(0,10)>=a)&&(!b||l.created.slice(0,10)<=b))}
function opts(){const u=k=>[...new Set(D.leads.map(l=>l[k]).filter(Boolean))].sort(),reps=[...new Set([...u('setter'),...u('closer')])];
const f=(id,a,p)=>{const e=$(id),v=e.value;e.innerHTML=`<option value="">${p}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join('');e.value=v};f('fr',reps,'All reps');f('fs',OPT.src,'All sources');f('fst',ST,'All stages');$('role').value=D.role;$('me').value=D.me}
function clr(){['fr','fs','f1','f2'].forEach(i=>$(i).value='');all()}['fr','fs','f1','f2'].forEach(i=>$(i).onchange=()=>all());
const V=[['today','Today'],['board','Board'],['log','Leads'],['dash','Dashboard'],['fc','Forecast'],['daily','Daily'],['imp','Import']];
function show(v){V.forEach(([k])=>$('v-'+k).classList.toggle('on',k==v));$('nav').innerHTML=V.filter(([k])=>!(D.role=='Setter'&&k=='fc')).map(([k,t])=>`<button class="${k==v?'on':''}" onclick="show('${k}')">${t}</button>`).join('');if(v=='imp')impUI()}
// ---- lead creation & stage moves
function newLead(o){const t=iso();D.seq++;const l=Object.assign({id:'DL-2026-'+String(D.seq).padStart(5,'0'),stage:'New Lead',created:t,source:'Cold Call',mods:[],tl:[],acts:[]},o);l.tl.push({t:l.created,e:'Lead created',s:l.stage});D.leads.push(l);return l}
function mv(l,s,e){if(l.stage==s)return;audit(l,'stage',l.stage,s);l.stage=s;l.tl.push({t:iso(),e:e||'Moved to '+s,s})}
function audit(l,f,o,nw){if(String(o??'')!=String(nw??''))D.audit.push({t:iso(),id:l.id,by:D.me||D.role,f,o,n:nw})}
function drop(e,s){e.preventDefault();const l=D.leads.find(x=>x.id==e.dataTransfer.getData('t'));if(!l||l.stage==s)return;if(s=='Won'&&!fin(l)){edit(l.id,'Enter Proposal/Deal Value before marking Won.');return}if(s=='Lost'){edit(l.id,'Pick a Loss Reason and Lost Note, set stage Lost, then Save.');return}mv(l,s);sv();all()}
// ---- board
function card(l){const f=fuS(l);return `<div class="card ${f}" draggable="true" ondragstart="event.dataTransfer.setData('t','${l.id}')" onclick="edit('${l.id}')"><b>${esc(l.name||l.company)}</b><small>${esc(l.company)}</small><small>${esc(l.setter||'–')} → ${esc(l.closer||'–')} · ${esc(l.source)}</small><small>${fin(l)?inr(fin(l)):''} · ${ds(l)}d since activity${l.nextFu?' · FU '+l.nextFu:''}</small>${l.demoDate?'<span class="bd">Demo '+l.demoDate.slice(0,10)+'</span>':''}${l.propStatus?'<span class="bd">Prop: '+l.propStatus+'</span>':''}${fin(l)&&l.stage!='New Lead'?'<span class="bd">'+pay(l)+'</span>':''}${f=='red'?'<span class="bd r">Overdue</span>':f=='yel'?'<span class="bd o">Due soon</span>':''}</div>`}
function board(){const L=VL();$('board').innerHTML=ST.map(s=>{const c=L.filter(l=>l.stage==s);return `<div class="col" ondragover="event.preventDefault()" ondrop="drop(event,'${s}')"><h3>${s}<span>${c.length}</span></h3>${c.length?c.map(card).join(''):'<span class="note">Empty</span>'}</div>`}).join('')}
// ---- lead dialog
function edit(id,msg){const l=D.leads.find(x=>x.id==id)||{stage:'New Lead',created:iso(),source:'Cold Call',mods:[],tl:[]};const e=!!id;
const inp=([k,t,ty,o])=>`<label>${t}${ty=='sel'?`<select id="f_${k}">${o.map(x=>`<option ${x==(l[k]||'')?'selected':''}>${x}</option>`).join('')}</select>`:ty=='textarea'?`<textarea id="f_${k}" rows="2">${esc(l[k])}</textarea>`:`<input id="f_${k}" type="${ty||'text'}" value="${esc(l[k])}" ${o?'list="sl"':''}>`}</label>`;
const ph=(l.phone||'').replace(/[^\d+]/g,''),wa=ph.replace(/\D/g,'').length==10?'91'+ph:ph.replace(/\D/g,'');
$('dlg').innerHTML=`<form method="dialog" onsubmit="return false"><b>${esc(l.id||'New lead')}</b> <span class="note">${e?'Final value '+inr(fin(l))+' · '+pay(l)+' · Balance '+inr(bal(l)):''}</span>
${e?`<div class="qa"><a href="tel:${esc(ph)}">📞 Call</a><a target="_blank" href="https://wa.me/${wa}">💬 WhatsApp</a><button onclick="actDlg('${l.id}')">📝 Activity</button><button onclick="qs('${l.id}','Demo Booked')">📅 Book Demo</button><button onclick="qs('${l.id}','Proposal Sent')">📄 Proposal</button><button onclick="qs('${l.id}','Won')">✅ Won</button><button onclick="qs('${l.id}','Lost')">❌ Lost</button></div>`:''}
<p id="err" class="err">${esc(msg||'')}</p>${G.map(([g,fs])=>`<h2>${g}</h2><div class="grid">${fs.map(inp).join('')}</div>`).join('')}
<h2>ERP Requirement / Modules</h2><div class="grid">${OPT.mod.map(m=>`<label style="flex-direction:row;gap:6px"><input type="checkbox" class="mod" value="${m}" ${(l.mods||[]).includes(m)?'checked':''} style="width:auto"> ${m}</label>`).join('')}</div>
<div class="row"><button class="p big" onclick="save('${id||''}')">Save</button><button onclick="dlg.close()">Close</button>${e?`<button class="d" onclick="rm('${l.id}')">Delete</button>`:''}</div>
${e?`<h2>Commission</h2><p class="note">Net revenue ${inr(net(l))} · Setter ${inr(cS(l))} · Closer ${inr(cC(l))} · Total ${inr(cS(l)+cC(l))}</p><h2>Timeline</h2><div class="tl">${[...l.tl].reverse().map(x=>`<div><b>${x.t.slice(0,16).replace('T',' ')}</b> – ${esc(x.e)}</div>`).join('')}</div>`:''}</form><datalist id="sl">${[...new Set(D.leads.flatMap(x=>[x.setter,x.closer]).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join('')}</datalist>`;$('dlg').showModal()}
function qs(id,s){const l=D.leads.find(x=>x.id==id);if(s=='Demo Booked'){$('f_stage').value='Demo Booked';$('f_demoStatus').value='Scheduled';$('f_demoDate').focus()}else if(s=='Proposal Sent'){$('f_stage').value='Proposal Sent';$('f_propStatus').value='Sent';if(!$('f_propDate').value)$('f_propDate').value=td();$('f_propVal').focus()}else if(s=='Won'){$('f_stage').value='Won';$('f_collected').focus()}else{$('f_stage').value='Lost';$('f_loss').focus()}}
function save(id){const g=k=>$('f_'+k).value.trim(),o={};G.forEach(([_,fs])=>fs.forEach(([k])=>o[k]=g(k)));o.mods=[...document.querySelectorAll('.mod:checked')].map(x=>x.value);
const P=(a,b)=>{$('err').textContent=a;return b};
if(!o.name&&!o.company)return P('Lead Name or Company is required.');if(o.email&&!/^\S+@\S+\.\S+$/.test(o.email))return P('Invalid email.');if(o.phone&&!phs(o.phone).length)return P('Invalid phone.');
if(!id){const d=dup(o);if(d&&!confirm('Possible duplicate: '+(d.name||d.company)+' ('+d.id+'). Create anyway?'))return}
let l=D.leads.find(x=>x.id==id);const nw=!l;if(nw)l=newLead({});
if(o.propStatus=='Accepted'&&idx(o.stage)<idx('Payment Pending'))o.stage='Payment Pending';
if(n(o.collected)>=fin(Object.assign({},l,o))&&fin(Object.assign({},l,o))>0&&!o.paidDate)o.paidDate=td();
const tmp=Object.assign({},l,o);
if(o.stage=='Won'&&!fin(tmp))return P('Deal Value is required to mark Won.');
if(o.stage=='Lost'&&(!o.loss||!o.lossNote))return P('Loss Reason and Lost Note are required.');
['propVal','disc','collected','refund','setter','closer','sComm','cComm'].forEach(k=>audit(l,k,l[k],o[k]));
const st=o.stage;delete o.stage;if(nw)delete o.created;Object.assign(l,o);
if(nw){l.stage=st;l.tl[0].s=st}else mv(l,st);
if(o.propStatus&&o.propStatus!=tmpP[l.id]){}
sv();dlg.close();all()}
const tmpP={};
function rm(id){if(confirm('Delete this lead?')){D.leads=D.leads.filter(x=>x.id!=id);sv();dlg.close();all()}}
// ---- activity

<div class="row"><select id="imode"><option value="up">Import new + Update existing</option><option value="new">Import new only (skip duplicates)</option></select><button class="p big" onclick="doImp()">Import</button><button onclick="errDl()">Download Error Rows</button></div>
<h2>Preview (first 20)</h2>${T(['Status','Company','Lead','Phone','Stage','Issue'],R.slice(0,20).map(x=>TR([x.st,esc(x.o.company),esc(x.o.name),esc(x.o.phone),x.o.stage,esc(x.er.join(', ')||(x.ex?'matches '+x.ex.id:x.inF?'repeat in file':''))])))}`}
function doImp(){const mode=$('imode').value;let nw=0,up=0,sk=0,er=0;IMP.res.rows.forEach(x=>{if(x.st=='invalid'){er++;return}if(x.st=='dupfile'){sk++;return}
if(x.st=='dup'){if(mode=='new'){sk++;return}let ch=false;const l=x.ex;Object.entries(x.o).forEach(([k,v])=>{if(['stage','created','mods','loss','lossNote'].includes(k)||v===''||v==null)return;if(l[k]!==v){if(k=='notes'&&(l.notes||'').includes(v)){return}audit(l,k,l[k],v);l[k]=v;ch=true}});
if(l.stage=='New Lead'&&x.o.stage!='New Lead'){mv(l,x.o.stage,'Updated from import: '+x.o.stage);if(x.o.stage=='Lost'){l.loss=x.o.loss;l.lossNote=x.o.lossNote}ch=true}
if(ch){l.tl.push({t:iso(),e:'Updated from import'});up++}else sk++;return}
const l=newLead(x.o);if(x.o.stage=='Lost'){l.loss=x.o.loss;l.lossNote=x.o.lossNote}l.tl.push({t:iso(),e:'Imported from '+IMP.fn});nw++});
D.imports.push({fn:IMP.fn,t:iso(),by:D.me||D.role,nw,up,sk,er});sv();IMP.rows=[];all();$('v-imp').insertAdjacentHTML('afterbegin',`<div class="kpi" style="margin-top:8px"><b>Import done</b> – New: ${nw} · Updated: ${up} · Duplicates skipped: ${sk} · Errors: ${er}</div>`)}
function errDl(){const bad=IMP.res.rows.filter(x=>x.st=='invalid');if(!bad.length)return alert('No error rows.');const ws=XLSX.utils.aoa_to_sheet([[...IMP.hdr,'Error'],...bad.map(x=>[...IMP.rows[x.i],x.er.join('; ')])]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Errors');XLSX.writeFile(wb,'DrawLead_Import_Errors.xlsx')}
function tpl(){const H=['Lead Name','Company Name','Email','Phone','Source','Setter Name','Closer Name','Date Created','Lead Status','Notes','Industry','Company Size','Location','Requirement','Decision Maker','Estimated Deal Value'],W=XLSX.utils.book_new();XLSX.utils.book_append_sheet(W,XLSX.utils.aoa_to_sheet([H]),'Leads');
const ins=[['Field','Instructions'],['Lead Name','Contact person. If blank the Company is used.'],['Company Name','Required if no Lead Name.'],['Email','Primary duplicate key.'],['Phone','Secondary duplicate key. Several numbers may be separated by "/".'],['Source','e.g. Cold Call, BNI, LinkedIn, Referral.'],['Setter Name / Closer Name','Rep names exactly as used in the CRM.'],['Date Created','YYYY-MM-DD.'],['Lead Status','One of: '+ST.join(', ')+'. Blank = New Lead.'],['Notes / Industry / Company Size / Location / Requirement / Decision Maker','Free text.'],['Estimated Deal Value','Number, no symbols.'],['Re-uploading','Matches by Email, then Phone, then Company+Lead Name; matches are updated, never duplicated.']];
XLSX.utils.book_append_sheet(W,XLSX.utils.aoa_to_sheet(ins),'Instructions');XLSX.writeFile(W,'DrawLead_Lead_Import_Template.xlsx')}
function all(){opts();today();board();log();dash();fc();daily();show(document.querySelector('.view.on').id.slice(2))}
all();
</script></body></html>
